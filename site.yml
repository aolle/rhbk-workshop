runtime:
  cache_dir: ./.cache/antora

site:
  title: Red Hat Build of Keycloak Workshop
  url: https://olleb.com/rhbk-workshop
  start_page: rhbk-workshop::index.adoc

content:
  sources:
    - url: ./
      start_path: documentation

asciidoc:
  attributes:
    release-version: main
    page-pagination: true
    openshift-version: '4.14'
    rhbk-version: '22.0.6'
    freeipa-version: '4.9.8'
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js

ui:
  bundle:
    url: https://github.com/zerodepth-hub/rhdp_showroom_theme/releases/download/v2.0.3/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./gh-pages
